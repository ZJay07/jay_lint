[tool.poetry]
name = "jay_lint"
version = "0.2.0"
description = "Jay Choy's personal linter"
authors = ["Jay Choy <choyzhengjay@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "src" },
    ]
exclude = [
    "src/lexing/test",
    "**/BUILD",
    "**/__pycache__",
    ]

[tool.poetry.dependencies]
python = ">=3.7,<4.0"
# TypeScript / JavaScript linting uses tree-sitter, which needs Python 3.9+.
tree-sitter = { version = ">=0.23", python = ">=3.9" }
tree-sitter-typescript = { version = ">=0.23", python = ">=3.9" }
# Reads jlint.toml / [tool.jlint]; tomllib is built in from Python 3.11.
tomli = { version = ">=1.1", python = "<3.11" }

[tool.poetry.scripts]
jay_lint = "src.cli:main"
jlint = "src.cli:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
