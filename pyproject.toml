[tool.poetry]
name = "jay_lint"
version = "0.0.2"
description = "Jay Choy's personal linter"
authors = ["Jay Choy <choyzhengjay@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "src/cli.py" },
    ]

[tool.poetry.dependencies]
python = ">=3.7,<4.0"
# TypeScript / JavaScript support is optional: pip install "jays-linter[ts]"
tree-sitter = { version = ">=0.23", optional = true, python = ">=3.9" }
tree-sitter-typescript = { version = ">=0.23", optional = true, python = ">=3.9" }

[tool.poetry.extras]
ts = ["tree-sitter", "tree-sitter-typescript"]

[tool.poetry.scripts]
jay_lint = "cli:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"