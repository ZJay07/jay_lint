name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.9.0"

    - name: Use the pinned Python (.python-version) for Please
      run: ./scripts/use_uv_python.sh

    - name: Build
      run: ./pleasew build //src/...

    - name: Test
      run: ./pleasew test //src/...
